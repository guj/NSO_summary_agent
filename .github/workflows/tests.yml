name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # the Docker image's Python
      # The versions the Docker image installs, plus pytest from the dev extra.
      # The suite is offline: it needs no .env, NSO, LLM endpoint or MCP server.
      - run: python -m pip install -c deploy/agent/constraints.txt -e '.[dev]'
      - run: python -m pytest -q
