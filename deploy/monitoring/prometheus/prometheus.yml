# Prometheus config for NSO summary agent metrics (via Pushgateway).
# The agent on the host pushes to http://127.0.0.1:9091 after each run.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
