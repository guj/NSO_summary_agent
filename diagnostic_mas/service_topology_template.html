<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service topology</title>
<style>*{box-sizing:border-box}body{margin:0;color:#183247;background:white;font:14px/1.5 system-ui}main{padding:10px}.controls{display:flex;gap:10px;flex-wrap:wrap}label{display:flex;flex-direction:column;font-size:12px;color:#536777}select,input,button{font:inherit;padding:8px;border:1px solid #bccbd6;border-radius:5px;background:white;color:#183247}input{min-width:230px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}aside{border-left:1px solid #dbe3e9;padding:0 14px;max-height:690px;overflow:auto;overflow-wrap:anywhere}h2{font-size:18px}h3{font-size:14px}.muted{color:#607383;font-size:12px}.evidence{white-space:pre-wrap;overflow-wrap:anywhere}.row{cursor:pointer}.row:hover rect,.row:focus rect{stroke-width:3}.row:focus{outline:none}svg{width:100%;height:auto}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}summary{cursor:pointer}li{margin:8px 0}#count{margin:12px 0}.legend{font-size:12px;margin-bottom:12px}.legend span{margin-right:12px}.swatch{display:inline-block;width:16px;border-top:3px solid;margin-right:4px} @media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #dbe3e9;max-height:450px}}</style>
<main><div class="controls"><label>Device<select id="device"></select></label><label>Service type<select id="type"><option value="">All types</option></select></label><label>Final status<select id="status"><option value="">All statuses</option><option value="attention">Needs attention</option><option value="up">OpUp</option><option value="down">Down</option><option value="degraded">Degraded</option><option value="unknown">Unknown</option></select></label><label>Find service<input id="search" placeholder="Service ID or attachment"></label></div><p id="count" aria-live="polite"></p><div class="legend"><span style="color:#247459"><i class="swatch"></i>OpUp</span><span style="color:#b83b3b"><i class="swatch"></i>Down</span><span style="color:#a05d0c"><i class="swatch"></i>Degraded</span><span style="color:#927421"><i class="swatch" style="border-top-style:dashed"></i>Unknown</span>Line color is the service assessment, not an individual link diagnosis.</div><div class="layout"><section><svg id="map" role="img" aria-label="Device-centered logical service membership"></svg><div><button id="prev">Previous</button> <span id="page"></span> <button id="next">Next</button></div></section><aside id="detail" aria-live="polite"></aside></div><p class="muted">Source: this report’s saved case. No additional queries. Device roles and attachment names are shown only when recorded. Click a service for basic-check evidence and separately attributed LLM findings.</p></main>
<script>const data=__SERVICE_DATA__;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', colors={up:'#247459',down:'#b83b3b',degraded:'#a05d0c',unknown:'#927421'}, labels={up:'OpUp',down:'Down',degraded:'Degraded',unknown:'Unknown'};
let page=0,selected=null;const size=6;
function el(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e}
function option(value,text,parent){const e=el('option',text,parent);e.value=value}
const devices=[...new Set(data.flatMap(r=>r.devices))].sort();option('','All devices',$('device'));devices.forEach(d=>option(d,d,$('device')));$('device').value=devices.find(d=>d==='losa-data-sw')||devices[0]||'';
[...new Set(data.map(r=>r.type))].sort().forEach(t=>option(t,t.toUpperCase(),$('type')));
function svg(tag,attrs,parent=$('map'),text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;parent.append(e);return e}
function text(x,y,value,parent,attrs={}){return svg('text',{x,y,fill:'#203d51','font-size':12,...attrs},parent,value)}
function draw(){const device=$('device').value,query=$('search').value.toLowerCase();const rows=data.filter(r=>(!device||r.devices.includes(device))&&(!$('type').value||r.type===$('type').value)&&(!$('status').value||($('status').value==='attention'?r.status!=='up':r.status===$('status').value))&&[r.name,...r.attachments.map(a=>a.label)].join(' ').toLowerCase().includes(query));page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));const visible=rows.slice(page*size,(page+1)*size);$('count').textContent=rows.length+' matching services · '+data.length+' in saved inventory';$('map').replaceChildren();const h=Math.max(240,visible.length*105+35);$('map').setAttribute('viewBox','0 0 790 '+h);$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=rows.length;$('page').textContent=rows.length?'Page '+(page+1)+' / '+Math.ceil(rows.length/size):'No matches';if(!visible.length){text(30,70,'No services match these filters.');$('detail').replaceChildren();return}
const cy=h/2;svg('rect',{x:8,y:cy-35,width:168,height:70,rx:12,fill:'#183c59'});text(92,cy,device||'Saved services',undefined,{'text-anchor':'middle',fill:'white','font-size':14});text(92,cy+19,device?'selected device':'inventory',undefined,{'text-anchor':'middle',fill:'#c7dbe9','font-size':10});
visible.forEach((r,i)=>{const y=60+i*105,c=colors[r.status];svg('path',{d:`M176 ${cy} C220 ${cy} 205 ${y} 245 ${y}`,fill:'none',stroke:c,'stroke-width':2,'stroke-dasharray':r.status==='unknown'?'6 4':''});svg('path',{d:`M485 ${y} H525`,stroke:c,'stroke-width':2,'stroke-dasharray':r.status==='unknown'?'6 4':''});const g=svg('g',{class:'row',role:'button',tabindex:0,'aria-label':r.type+' '+r.name+' '+labels[r.status]});svg('title',{},g,r.name);svg('rect',{x:245,y:y-34,width:240,height:68,rx:8,fill:selected===r.key?'#eaf2f8':'#f5f8fa',stroke:c},g);text(258,y-13,r.type.toUpperCase()+' · '+labels[r.status],g,{'font-weight':600});text(258,y+7,r.name.length>29?r.name.slice(0,28)+'…':r.name,g);text(258,y+25,r.attachments.filter(a=>a.device===device).map(a=>a.label).join(', ').slice(0,33)||'Select for recorded evidence',g,{'font-size':10});const peers=r.devices.filter(d=>d!==device);const remote=peers.length?peers.map(d=>d+(r.borders.includes(d)?' [border]':'')):r.attachments.filter(a=>a.device===device).map(a=>a.label);const lines=remote.length?remote:['Membership / attachments not recorded'];lines.slice(0,3).forEach((v,j)=>text(535,y-12+j*16,v,undefined,{'font-size':11}));if(lines.length>3)text(535,y+37,'+'+(lines.length-3)+' more; select for details',undefined,{'font-size':10});g.onclick=()=>{selected=r.key;draw()};g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=r.key;draw()}}});const r=visible.find(r=>r.key===selected)||visible[0];selected=r.key;detail(r)}
function block(title,value){if(!value)return;el('h3',title,$('detail'));el('div',typeof value==='string'?value:JSON.stringify(value,null,2),$('detail')).className='evidence'}
function detail(r){$('detail').replaceChildren();el('h2',r.type.toUpperCase()+' · '+labels[r.status],$('detail'));el('p',r.name,$('detail'));block('Final assessment basis',r.basis);block('Device membership',r.devices.map(d=>d+(r.borders.includes(d)?' — configured border dependency':'')+' · sync: '+(r.sync[d]||'unrecorded')).join('\n'));block('Recorded attachments',r.attachments.map(a=>a.device+' · '+a.label+' · '+a.status).join('\n'));block('Basic operational checks',r.basic_status+' — '+r.basic_reason);block('Basic checks collected at',r.checked_at);if(r.checks.length){const d=el('details',undefined,$('detail'));el('summary',r.checks.length+' recorded basic checks',d);const list=el('ul',undefined,d);r.checks.forEach(c=>el('li', (c.device||'')+' '+(c.check||'')+' ['+(c.status||'unknown')+'] '+(typeof c.observation==='string'?c.observation:JSON.stringify(c.observation||{}))+(c.command?' · command: '+c.command:''),list))}if(r.diagnosis){block('Additional investigation — '+(r.diagnosis.source||'unrecorded source'), 'Recorded status: '+r.diagnosis.status+(r.diagnosis.complete===false?' (incomplete)':''));block('Investigation observations',r.diagnosis.observed);block('Investigation cause / interpretation',r.diagnosis.cause);block('Verification gap',r.diagnosis.verification_gap);block('Suggested next steps — not applied or verified',r.diagnosis.fix_suggestion)}else block('Additional investigation','No dataplane diagnosis recorded for this service.');}
['device','type','status'].forEach(id=>$(id).onchange=()=>{page=0;selected=null;draw()});$('search').oninput=()=>{page=0;selected=null;draw()};$('prev').onclick=()=>{page--;selected=null;draw()};$('next').onclick=()=>{page++;selected=null;draw()};draw();
</script></html>
