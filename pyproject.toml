[project]
name = "nso-summary-agent"
version = "0.1.0"
description = "Scheduled NSO health summary agent (MCP collect + FABRIC AI summarize)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nso-summary-run = "agent.run:main"
nso-multi-agent-run = "multi_agent.run:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "nso_facts", "nso_report", "multi_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
